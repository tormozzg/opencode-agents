name: Foundation AI validation

on:
  push:
    branches:
      - "foundation-ai/**"
    paths:
      - ".opencode/**"
      - "opencode.jsonc"
      - "foundation-ai/**"
      - ".github/workflows/foundation-ai-validation.yml"
  pull_request:
    paths:
      - ".opencode/**"
      - "opencode.jsonc"
      - "foundation-ai/**"
      - ".github/workflows/foundation-ai-validation.yml"

permissions:
  contents: read

jobs:
  structural-and-installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate structure and OpenCode V1 permissions
        run: bash foundation-ai/scripts/validate-pack.sh
      - name: Test safe install, reinstall, and uninstall
        run: bash foundation-ai/scripts/test-install.sh

  opencode-v1-19-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned OpenCode 1.19.0 CLI
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-x64.tar.gz" -o "$RUNNER_TEMP/opencode.tar.gz"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
          OPENCODE_BIN="$(find "$RUNNER_TEMP/opencode" -type f -name opencode | head -n 1)"
          test -n "$OPENCODE_BIN"
          chmod +x "$OPENCODE_BIN"
          echo "$(dirname "$OPENCODE_BIN")" >> "$GITHUB_PATH"
      - name: Verify exact version and agent discovery
        run: |
          opencode --version | tee "$RUNNER_TEMP/opencode-version.txt"
          grep -Eq '^1\.19(\.0)?' "$RUNNER_TEMP/opencode-version.txt"
          opencode agent list | tee "$RUNNER_TEMP/agents.txt"
          for agent in daniel-olivaw giskard-reventlov susan-calvin elijah-baley kelden-amadiro andrew-martin han-fastolfe golan-trevize jothan-leebig; do
            grep -q "^$agent (" "$RUNNER_TEMP/agents.txt" || { echo "Missing agent: $agent"; exit 1; }
          done
      - name: Verify resolved V1 configuration
        run: |
          opencode debug config > "$RUNNER_TEMP/resolved-config.json"
          jq -e '.default_agent == "daniel-olivaw" and .subagent_depth == 2' "$RUNNER_TEMP/resolved-config.json"
