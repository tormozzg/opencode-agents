name: Foundation AI validation

on:
  push:
    branches:
      - "foundation-ai/**"
    paths:
      - "agents/**"
      - "skills/**"
      - "protocols/**"
      - "opencode.jsonc"
      - "scripts/**"
      - "source-snapshot/**"
      - "README.md"
      - "OPENCODE_1_19_COMPATIBILITY.md"
      - "SOURCE_*.md"
      - "RELEASE_NOTES_*.md"
      - "opencode.jsonc.fragment"
      - "AGENTS.md"
      - "install.sh"
      - "uninstall.sh"
      - ".github/workflows/foundation-ai-validation.yml"
  pull_request:
    paths:
      - "agents/**"
      - "skills/**"
      - "protocols/**"
      - "opencode.jsonc"
      - "scripts/**"
      - "source-snapshot/**"
      - "README.md"
      - "OPENCODE_1_19_COMPATIBILITY.md"
      - "SOURCE_*.md"
      - "RELEASE_NOTES_*.md"
      - "opencode.jsonc.fragment"
      - "AGENTS.md"
      - "install.sh"
      - "uninstall.sh"
      - ".github/workflows/foundation-ai-validation.yml"

permissions:
  contents: read

concurrency:
  group: foundation-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-and-installer-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate structure and OpenCode V1 permissions
        run: bash scripts/validate-pack.sh
      - name: Test safe install, reinstall, and uninstall
        run: bash scripts/test-install.sh

  opencode-v1-19-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned OpenCode 1.19.0 CLI
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v1.19.0/opencode-linux-x64.tar.gz" -o "$RUNNER_TEMP/opencode.tar.gz"
          echo "7bb9e61ad6feacf2e89c10a6a2c1840e3de4220bb50ba1fc7110f31806076aec  $RUNNER_TEMP/opencode.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
          OPENCODE_BIN="$(find "$RUNNER_TEMP/opencode" -type f -name opencode | head -n 1)"
          test -n "$OPENCODE_BIN"
          chmod +x "$OPENCODE_BIN"
          echo "$(dirname "$OPENCODE_BIN")" >> "$GITHUB_PATH"
      - name: Install project-local agent definitions
        run: bash install.sh --yes --config-dir "$GITHUB_WORKSPACE/.opencode"
      - name: Verify exact version and agent discovery
        run: |
          VERSION="$(opencode --version)"
          echo "$VERSION"
          test "$VERSION" = "1.19.0"
          opencode agent list | tee "$RUNNER_TEMP/agents.txt"
          grep -q '^hari-seldon (primary)$' "$RUNNER_TEMP/agents.txt"
          grep -q '^giskard-reventlov (all)$' "$RUNNER_TEMP/agents.txt"
          grep -q '^daniel-olivaw (all)$' "$RUNNER_TEMP/agents.txt"
          for agent in elijah-baley kelden-amadiro hugo-amaryl han-fastolfe golan-trevize jothan-leebig dors-venabili; do
            grep -q "^$agent (subagent)$" "$RUNNER_TEMP/agents.txt" || { echo "Missing or wrong mode: $agent"; exit 1; }
          done
      - name: Verify resolved project configuration
        run: |
          opencode debug config > "$RUNNER_TEMP/resolved-config.json"
          jq -e '.default_agent == "hari-seldon" and .subagent_depth == 2' "$RUNNER_TEMP/resolved-config.json"
      - name: Verify global installer and global agent discovery
        run: |
          GLOBAL_HOME="$RUNNER_TEMP/global-home"
          mkdir -p "$GLOBAL_HOME"
          HOME="$GLOBAL_HOME" bash install.sh --yes
          cp "$GLOBAL_HOME/.config/opencode/foundation-ai/opencode.jsonc.fragment" "$GLOBAL_HOME/.config/opencode/opencode.jsonc"
          cd "$RUNNER_TEMP"
          HOME="$GLOBAL_HOME" XDG_CONFIG_HOME="$GLOBAL_HOME/.config" opencode agent list | tee "$RUNNER_TEMP/global-agents.txt"
          grep -q '^hari-seldon (primary)$' "$RUNNER_TEMP/global-agents.txt"
          grep -q '^giskard-reventlov (all)$' "$RUNNER_TEMP/global-agents.txt"
          grep -q '^daniel-olivaw (all)$' "$RUNNER_TEMP/global-agents.txt"
          HOME="$GLOBAL_HOME" XDG_CONFIG_HOME="$GLOBAL_HOME/.config" opencode debug config > "$RUNNER_TEMP/global-config.json"
          jq -e '.default_agent == "hari-seldon" and .subagent_depth == 2' "$RUNNER_TEMP/global-config.json"
          HOME="$GLOBAL_HOME" bash "$GITHUB_WORKSPACE/uninstall.sh" --yes
